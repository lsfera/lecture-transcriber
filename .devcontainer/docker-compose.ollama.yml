services:
  ollama:
    image: ollama/ollama:0.40.11
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - devcontainer_shared
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # Uncomment for GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:0.40.11
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    command: ["pull", "llama3.2:3b"]
    networks:
      - devcontainer_shared

  ollama-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.5
    container_name: ollama-webui
    ports: ["127.0.0.1:3000:8080"]
    volumes:
      - ollama-webui:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_AUTH=false'
      - 'ENABLE_LOGIN_FORM=false'
      - 'ENABLE_INITIAL_ADMIN_SIGNUP=false'
    networks:
      - devcontainer_shared
    restart: unless-stopped

volumes:
  ollama_data:
  ollama-webui:

networks:
  devcontainer_shared:
    name: lecture-transcriber-dev-net
    external: true
