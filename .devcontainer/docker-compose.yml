services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.14-trixie
    env_file:
      - .env
    environment:
      - DISPLAY=${DISPLAY_VALUE:-:0}
    volumes:
      - ..:/workspace:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../input:/input:cached
      - pip-cache:/home/vscode/.cache/pip
    networks:
      - devcontainer_shared
    command: sleep infinity

networks:
  devcontainer_shared:
    name: lecture-transcriber-dev-net
    driver: bridge

volumes:
  pip-cache:
